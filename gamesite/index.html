<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1000px;
        }

        .game-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #334155;
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-card:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
        }

        .game-info h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            color: #f1f5f9;
        }

        .game-info p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .play-btn {
            display: inline-block;
            background-color: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            text-align: center;
            font-weight: 600;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }

        .play-btn:hover {
            background-color: #7dd3fc;
        }

        footer {
            margin-top: auto;
            padding-top: 3rem;
            color: #64748b;
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>Arcade Hub</h1>
        <p>Pick a game and jump right in</p>
    </header>

    <main class="game-grid">
        
        <div class="game-card">
            <div class="game-info">
                <h3>How To Fish</h3>
                <p>Learn the basics of fishing in this interactive game.</p>
            </div>
            <a href="HowToFish/" class="play-btn">Play Game</a>
        </div>

        <div class="game-card">
            <div class="game-info">
                <h3>Ravenfield</h3>
                <p>Action-packed tactical singleplayer shooter.</p>
            </div>
            <a href="ravenfield/" class="play-btn">Play Game</a>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 Arcade Hub. All rights reserved.</p>
    </footer>

</body>
</html>
