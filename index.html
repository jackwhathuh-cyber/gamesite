<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            margin-bottom: 30px;
        }
        .game-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .game-card {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            width: 250px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .game-info h3 {
            margin-top: 0;
            color: #4CAF50;
        }
        .game-info p {
            font-size: 14px;
            color: #ccc;
        }
        .play-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .play-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>Arcade Hub</h1>

    <div class="game-grid">
        <div class="game-card">
            <div class="game-info">
                <h3>How To Fish</h3>
                <p>Relaxing fishing game simulator.</p>
            </div>
            <a href="HowToFish/" class="play-btn">Play Game</a>
        </div>

        <div class="game-card">
            <div class="game-info">
                <h3>SCP</h3>
                <p>Action-packed tactical singleplayer shooter.</p>
            </div>
            <a href="scp/" class="play-btn">Play Game</a>
        </div>

        <div class="game-card">
            <div class="game-info">
                <h3>Among Us</h3>
                <p>Find the imposter before it's too late!</p>
            </div>
            <a href="amongus/" class="play-btn">Play Game</a>
        </div>
    </div>

</body>
</html>
